name: Documentation evidence checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check chart data and documentation links (does not run the game)
        run: uv run --python 3.12 scripts/check_docs.py
      - name: Check multiplayer resource charts against reviewed evidence
        run: uv run --python 3.12 scripts/check_resources.py
      - name: Check profiling observations and their limits
        run: uv run --python 3.12 scripts/check_profiling.py
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Check scalar memory output semantics (test doubles; no game)
        run: dotnet run --project tests/NOPerf.MemoryCounterTests -c Release
